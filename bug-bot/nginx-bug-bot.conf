# HTTP -> 自动跳转 HTTPS
server {
    listen 80;
    server_name 47.108.149.191.nip.io 47.108.149.191;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 反向代理到 Flask 应用
server {
    listen 443 ssl http2;
    server_name 47.108.149.191.nip.io 47.108.149.191;

    ssl_certificate /etc/letsencrypt/live/47.108.149.191.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.108.149.191.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/bug-bot-access.log;
    error_log /var/log/nginx/bug-bot-error.log;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}