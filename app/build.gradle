plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

def debugVersionCode = (System.currentTimeMillis() / 1000).toInteger()
def isCi = System.getenv('CI') != null || System.getenv('TRAE_DEBUG_SERVER_URL') != null

android {
    namespace 'com.weiguangchangxing.weiguang_plus'
    compileSdk 36

    defaultConfig {
        applicationId "com.weiguangchangxing.weiguang_plus"
        minSdk 26
        targetSdk 36
        versionCode isCi ? debugVersionCode : 3
        versionName "2.1.0"

        buildConfigField "String", "TRAE_DEBUG_SERVER_URL", "\"\""
        buildConfigField "String", "TRAE_DEBUG_SESSION_ID", "\"\""
        buildConfigField "String", "TRAE_DEBUG_RUN_ID", "\"\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.2'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // 基础依赖
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.1'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // CameraX
    def cameraxVersion = "1.4.1"
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // ML Kit - OCR文字识别（药品识别）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'

    // ML Kit - 物品识别（实时物体检测）
    implementation 'com.google.mlkit:object-detection:17.0.1'

    // ML Kit - 图片标签（通用物品分类）
    implementation 'com.google.mlkit:image-labeling:17.0.8'

    // MediaPipe Tasks - 手部关键点检测（实时手语识别）
    implementation 'com.google.mediapipe:tasks-vision:0.10.18'

    // Room本地数据库
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-runtime:${roomVersion}"
    implementation "androidx.room:room-ktx:${roomVersion}"
    kapt "androidx.room:room-compiler:${roomVersion}"

    // DataStore配置存储
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2023.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}